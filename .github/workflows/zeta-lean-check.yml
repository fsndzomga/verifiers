name: Zeta Lean scratch check

on:
  push:
    branches:
      - scratch/zeta-lean-check-20260810
    paths:
      - 'lean-toolchain'
      - 'lakefile.toml'
      - 'ZetaResearch.lean'
      - 'ZetaResearch/**'
      - '.github/workflows/zeta-lean-check.yml'

jobs:
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
      - name: Build and kernel-check
        shell: bash
        run: |
          source "$HOME/.elan/env"
          lake update
          lake exe cache get
          lake build
